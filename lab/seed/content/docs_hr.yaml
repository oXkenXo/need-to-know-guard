- path: HR/Benefits Guide 2026.docx
  owner: skim
  date: 2026-02-03
  need: ["@all"]
  body: |
    # Benefits Guide 2026
    ## Health insurance
    All permanent employees are covered from the first day of employment. Spouses and up to three children can be added at no extra cost.
    ## Annual leave
    18 days per year, plus public holidays. Up to 5 unused days can be carried over to the next year.
    ## Learning budget
    USD 600 per person per year for courses, books or conferences. Ask your manager before booking.
    ## Wellbeing
    Free counselling sessions through our employee assistance programme (6 sessions per year).

