    # Competitor Research — Q3 2026
    ## SwiftHaul
    Cut prices by ~8% on city routes in August; no tracking app yet.
    ## Parcelnet
    Launched next-day regional delivery; heavy spend on search ads around "same-day delivery".
    ## Takeaways
    Our real-time tracking demo is our strongest message. Avoid price competition on city routes.

