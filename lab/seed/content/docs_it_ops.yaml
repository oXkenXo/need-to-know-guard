- path: IT/Security/Incident Report - Phishing - Aug 2026.docx
  owner: nweiss
  date: 2026-08-22
  need: ["@it", "@managers"]
  body: |
    # Incident Report — Phishing (19 August 2026)
    A fake "invoice overdue" email reached 11 staff. Two people entered their passwords on the fake page; both accounts were reset within 40 minutes. No data loss was found.
    Actions: block sender domain, security awareness session on 3 September, enable sign-in alerts.

- path: IT/Policies/Acceptable Use Policy.docx
  owner: kpark
  date: 2026-02-20
  need: ["@all"]
  body: |
    # Acceptable Use Policy
    - Company accounts are personal; never share passwords.
    - Store work documents in Nextcloud team folders, not on USB sticks.
    - Public links must have an expiry date and should be avoided for confidential files.
    - Report suspicious emails to support@meridian.test.

- path: IT/Policies/Backup Policy.docx
  owner: kpark
  date: 2026-03-11
  need: ["@it", "@managers"]
  body: |
    # Backup Policy
    Nextcloud and mail data are backed up nightly to the second site and kept for 35 days. Monthly backups are kept for 12 months. Restore tests are run every quarter.

