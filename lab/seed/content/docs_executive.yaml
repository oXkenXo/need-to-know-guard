- path: Executive/Strategy/Strategy 2027 - One Pager.docx
  owner: dreyes
  date: 2026-08-30
  need: ["@managers"]
  body: |
    # Meridian Labs — Strategy 2027
    ## Where we play
    Mid-size logistics and wholesale customers in the region who want reliable last-mile delivery and real-time tracking.
    ## Three priorities
    - Grow software-enabled services to 20% of revenue (from 6%).
    - Lift on-time delivery from 93% to 97%.
    - Keep headcount flat while revenue grows 12%.
    ## What this means for managers
    Every department sets two measurable 2027 goals linked to these priorities by 15 November.

