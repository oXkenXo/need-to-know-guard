- path: Executive/Restructuring/Restructuring Plan 2027 - v3.docx
  owner: pnair
  date: 2026-10-12
  need: [dreyes, pnair, mchen, skim]
  body: |
    # Organisation 2027 — Restructuring Plan (v3, draft for executive review)
    ## Summary
    Merge the Warehouse team into Logistics, outsource first-line IT support, and reduce Marketing agency spend. Net headcount change: −4 positions.
    ## Impact by department
    | Department | Positions removed | Positions added |
    | Operations | 2 (warehouse supervisor role not backfilled, one picker) | 0 |
    | IT | 1 (first-line support, outsourced) | 0 |
    | Marketing | 1 (vacant analyst role after internal transfer) | 0 |
    | Finance | 0 | 0 |
    ## Timeline
    Board approval 20 November; individual conversations from 1 December; changes effective 1 February 2027.
    ## Communication
    No information to staff before board approval. HR (Sarah Kim) prepares individual letters.

