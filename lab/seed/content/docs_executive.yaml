#   sheet  for .xlsx: {columns: [...], rows: [[...]]}

- path: Executive/Board/Board Meeting Minutes - 2026-09-24.docx
  owner: pnair
  date: 2026-09-25
  need: [dreyes, pnair, mchen]
  body: |
    # Board Meeting Minutes — 24 September 2026
    Present: Daniel Reyes (CEO), Priya Nair (COO), Mark Chen (CFO), three non-executive directors.
    ## 1. Q3 performance
    Revenue for Q3 came in at USD 4.82M, 3% below plan, mainly due to the delayed Westbridge contract. EBITDA margin held at 14.1% thanks to lower freight costs.
    ## 2. Project Falcon
    The CEO presented the opportunity to acquire Coastline Analytics. The board approved a non-binding offer range of USD 11–13M and asked the CFO to complete financial due diligence before 15 November.
    ## 3. Organisation 2027
    The COO presented a first draft of the 2027 restructuring. The board asked for headcount impact by department and a communication plan before any staff are informed.
    ## Actions
    - CFO: due-diligence report on Coastline Analytics (15 Nov).
    - COO: revised restructuring plan with HR input (31 Oct).
    - CEO: investor update draft (7 Nov).

- path: Executive/Project Falcon/Falcon - Acquisition Memo.docx
  owner: dreyes
  date: 2026-09-18
  need: [dreyes, pnair, mchen]
  body: |
    # Project Falcon — Acquisition Memo (Strictly Confidential)
    ## Target
    Coastline Analytics Ltd., 42 employees, route-optimisation software for regional logistics firms. 2025 revenue USD 3.1M, growing 38% year on year.
    ## Rationale
    - Adds a software revenue line to our logistics services.
    - Their optimisation engine would cut our own fleet costs by an estimated 6–8%.
    - Two of our top-10 customers already license their product.
    ## Price
    Opening offer USD 11.0M; walk-away price USD 13.0M. Earn-out of up to USD 2M tied to 2027 revenue.
    ## Confidentiality
    Only the deal team (CEO, COO, CFO) may discuss Falcon. Do not mention the target name in email subjects.

